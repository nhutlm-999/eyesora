spring.application.name=eyesora

# Connection URL for SQL Server using the Microsoft JDBC driver
spring.datasource.url=${DB_URL}

# Database username and password
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Use the Microsoft SQL Server JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings suitable for Microsoft SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.show_sql=true

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
# Medical Recommendation Settings
eyesora.recommendation.overdue-days=30
eyesora.recommendation.high-astigmatism-cyl=1.50
eyesora.recommendation.severe-myopia-sph=-6.00
eyesora.recommendation.borderline-sph-min=-3.00
eyesora.recommendation.borderline-sph-max=-2.50
eyesora.recommendation.min-group-size=20
eyesora.recommendation.max-results=5
eyesora.recommendation.overdue.rate=10.0
eyesora.recommendation.overdue.count=20
eyesora.recommendation.severe-rate=2.0
eyesora.recommendation.astigmatism-rate=5.0
eyesora.recommendation.myopia-gap-vs-average=10.0
